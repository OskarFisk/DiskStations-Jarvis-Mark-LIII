<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MARK LIII</title><style>body{margin:0;background:#090b10;color:#e9eef7;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:24px}.card{background:#11151d;border:1px solid #252c39;border-radius:14px;padding:18px;margin:14px 0}h1{margin:0 0 6px}small{color:#8f9bad}#log{min-height:300px;white-space:pre-wrap;overflow:auto}.row{display:flex;gap:10px}input,button{padding:12px;border-radius:9px;border:1px solid #303846;background:#0c1017;color:#fff}input{flex:1}button{cursor:pointer}.ok{color:#78e08f}.err{color:#ff7979}</style></head><body><main><div class="card"><h1>MARK LIII</h1><small>Synology DS413j • DSM 6.2 • ARMv5 / 88f628x</small><p id="status">Checking service…</p></div><div class="card"><h2>Chat</h2><div id="log"></div><div class="row"><input id="msg" placeholder="Ask MARK LIII…"><button onclick="send()">Send</button></div></div><div class="card"><h2>Settings</h2><div class="row"><input id="key" type="password" placeholder="Gemini API key"><input id="model" value="gemini-2.5-flash" placeholder="Model"></div><p><button onclick="save()">Save configuration</button> <span id="saved"></span></p></div></main><script>async function health(){try{let r=await fetch('/api/health');let j=await r.json();document.querySelector('#status').innerHTML='<span class="ok">● '+j.service+' is running</span>'}catch(e){document.querySelector('#status').innerHTML='<span class="err">Service unavailable</span>'}}async function send(){let x=document.querySelector('#msg'),m=x.value.trim();if(!m)return;let l=document.querySelector('#log');l.textContent+='\nYou: '+m+'\n';x.value='';let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});let t=await r.text();try{let j=JSON.parse(t);l.textContent+='MARK: '+(j.reply||j.error||t)+'\n'}catch{l.textContent+='MARK: '+t+'\n'}l.scrollTop=l.scrollHeight}async function save(){let key=document.querySelector('#key').value,model=document.querySelector('#model').value;let r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({gemini_api_key:key,model:model})});document.querySelector('#saved').textContent=r.ok?'Saved.':'Save failed.'}health();fetch('/api/config').then(r=>r.json()).then(j=>{if(j.model)document.querySelector('#model').value=j.model})</script></body></html>
